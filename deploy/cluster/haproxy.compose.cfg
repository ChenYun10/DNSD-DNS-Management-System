# docker-compose 版 haproxy 配置:后端用 compose 服务名
global
    maxconn 65535
    log stdout format raw local0 info

defaults
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout queue 5s
    log global
    option tcplog

frontend dns_udp
    bind :53 dgram
    mode dgram
    default_backend dns_udp_backend

backend dns_udp_backend
    mode dgram
    balance roundrobin
    server dnsd-1 dnsd-1:53 udp
    server dnsd-2 dnsd-2:53 udp

frontend dns_tcp
    bind :53
    mode tcp
    default_backend dns_tcp_backend

backend dns_tcp_backend
    balance roundrobin
    server dnsd-1 dnsd-1:53 check inter 5s fall 3 rise 2
    server dnsd-2 dnsd-2:53 check inter 5s fall 3 rise 2

frontend dot
    bind :853
    mode tcp
    default_backend dot_backend

backend dot_backend
    balance roundrobin
    server dnsd-1 dnsd-1:853 check inter 5s fall 3 rise 2
    server dnsd-2 dnsd-2:853 check inter 5s fall 3 rise 2

frontend doh
    bind :443
    mode tcp
    default_backend doh_backend

backend doh_backend
    balance roundrobin
    server dnsd-1 dnsd-1:443 check inter 5s fall 3 rise 2
    server dnsd-2 dnsd-2:443 check inter 5s fall 3 rise 2

frontend doq_udp
    bind :784 dgram
    mode dgram
    default_backend doq_backend

backend doq_backend
    mode dgram
    balance roundrobin
    server dnsd-1 dnsd-1:784 udp
    server dnsd-2 dnsd-2:784 udp

frontend apid_tcp
    bind :8080
    mode tcp
    default_backend apid_backend

backend apid_backend
    balance roundrobin
    server apid apid:8080 check inter 5s fall 3 rise 2
