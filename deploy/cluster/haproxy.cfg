# ---------------------------------------------------------------------------
# dns-platform 集群版 L4 负载均衡 (haproxy ≥ 2.4,支持 UDP dgram)
#
# 职责:把 UDP/TCP 53、DoT 853、DoH 443、DoQ 784 的流量分发到 N 个 dnsd 实例。
# 健康检查:TCP 端口探测(53/853/443);UDP 后端无法可靠探测,靠客户端重试
# + TCP 检查的旁路发现。
# 依赖 haproxy 的 UDP 负载均衡功能(haproxy 2.4+ / 2.9 稳定)。
# ---------------------------------------------------------------------------
global
    maxconn 65535
    log stdout format raw local0 info

defaults
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout queue 5s
    log global
    option tcplog

# --- 传统 DNS over UDP (53/udp) ---
frontend dns_udp
    bind :53 dgram
    mode dgram
    default_backend dns_udp_backend

backend dns_udp_backend
    mode dgram
    balance roundrobin
    # UDP 健康检查(可选,需自定义 DNS 探测报文):
    #   server dns1 10.0.0.11:53 udp check check-send "\xab\xcd\x01\x00\x00\x01\x00\x00\x00\x00\x00\x00\x07example\x03com\x00\x00\x01\x00\x01"
    server dns1 10.0.0.11:53 udp
    server dns2 10.0.0.12:53 udp

# --- 传统 DNS over TCP (53/tcp) ---
frontend dns_tcp
    bind :53
    mode tcp
    default_backend dns_tcp_backend

backend dns_tcp_backend
    balance roundrobin
    option tcp-check
    server dns1 10.0.0.11:53 check inter 5s fall 3 rise 2
    server dns2 10.0.0.12:53 check inter 5s fall 3 rise 2

# --- DoT (853/tcp, RFC 7858) ---
frontend dot
    bind :853
    mode tcp
    default_backend dot_backend

backend dot_backend
    balance roundrobin
    server dns1 10.0.0.11:853 check inter 5s fall 3 rise 2
    server dns2 10.0.0.12:853 check inter 5s fall 3 rise 2

# --- DoH (443/tcp,TLS 透传;dnsd 自带 TLS+HTTP/2,无需解包) ---
frontend doh
    bind :443
    mode tcp
    default_backend doh_backend

backend doh_backend
    balance roundrobin
    server dns1 10.0.0.11:443 check inter 5s fall 3 rise 2
    server dns2 10.0.0.12:443 check inter 5s fall 3 rise 2

# --- DoQ (784/udp, RFC 9250;QUIC 走 UDP) ---
frontend doq_udp
    bind :784 dgram
    mode dgram
    default_backend doq_backend

backend doq_backend
    mode dgram
    balance roundrobin
    server dns1 10.0.0.11:784 udp
    server dns2 10.0.0.12:784 udp

# --- 控制面 apid (8080) 如需暴露,也可挂在这 ---
frontend apid_tcp
    bind :8080
    mode tcp
    default_backend apid_backend

backend apid_backend
    balance roundrobin
    server apid1 10.0.0.20:8080 check inter 5s fall 3 rise 2
