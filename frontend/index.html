<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>DNS 云平台 · 管理控制台</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- 登录页 -->
  <div id="view-login" class="login-wrap hidden">
    <div class="login-card">
      <div class="login-logo">🛡️ DNS 云平台</div>
      <div class="login-sub">多租户 DoT / DoH / DoQ · ECS 智能解析 · 动态预热</div>
      <div class="form-group">
        <label>API 地址</label>
        <input id="login-api" type="text" placeholder="http://127.0.0.1:8080">
      </div>
      <div class="form-group">
        <label>用户名</label>
        <input id="login-user" type="text" autocomplete="username" placeholder="admin">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input id="login-pass" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <button id="login-btn" class="btn btn-primary btn-block">登 录</button>
      <div id="login-msg" class="form-msg"></div>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="view-main" class="shell hidden">
    <aside class="sidebar">
      <div class="brand">🛡️ DNS 云平台</div>
      <nav id="nav">
        <a data-view="dashboard" class="active">📊 总览</a>
        <a data-view="dot">🔐 DoT/DoH 端点</a>
        <a data-view="simulate">🧪 ECS 模拟</a>
        <a data-view="upstreams">🔀 上游与分流</a>
        <a data-view="cache">⚡ 缓存与预热</a>
        <a data-view="logs">📜 日志查询</a>
        <a data-view="tenants" class="admin-only">🏢 租户管理</a>
        <a data-view="users" class="admin-only">👤 用户管理</a>
        <a data-view="security" class="admin-only">🛡️ 安全中心</a>
      </nav>
      <div class="sidebar-foot">
        <div id="whoami" class="whoami"></div>
        <button id="logout-btn" class="btn btn-ghost btn-block">退出登录</button>
      </div>
    </aside>
    <main class="content" id="content"></main>
  </div>
</div>

<script src="js/api.js?v=20260828d"></script>
<script src="js/ui.js?v=20260828c"></script>
<script src="js/views.js?v=20260828c"></script>
<script src="js/app.js?v=20260828c"></script>
</body>
</html>
